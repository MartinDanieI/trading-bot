name: Escáner horario BTC / XAU

on:
  schedule:
    # Disparo principal: cron-job.org llama cada hora a la API (workflow_dispatch), que es puntual.
    # Esto es solo un RESPALDO cada 2 horas: el horario propio de GitHub se retrasa o salta
    # ejecuciones, sobre todo en la hora en punto (por eso el minuto 37).
    - cron: "37 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo mostrar el mensaje en el log (no enviar alertas)"
        type: boolean
        default: false
      mode:
        description: "Modo de alerta para esta ejecución"
        type: choice
        options: [default, SIGNALS_ONLY, HOURLY_SUMMARY]
        default: default

concurrency:
  group: hourly-scanner
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # necesario para guardar el caché del estado anti-spam

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALERT_PROVIDER: ${{ vars.ALERT_PROVIDER || 'auto' }}
      # Opcionales (Settings > Secrets and variables > Actions > Variables)
      ALERT_MODE: ${{ vars.ALERT_MODE || 'SIGNALS_ONLY' }}
      SCORE_THRESHOLD: ${{ vars.SCORE_THRESHOLD || '70' }}
      COOLDOWN_HOURS: ${{ vars.COOLDOWN_HOURS || '4' }}
      HEARTBEAT_HOUR: ${{ vars.HEARTBEAT_HOUR || '8' }}
      REPORT_WEEKDAY: ${{ vars.REPORT_WEEKDAY || '6' }}
      REPORT_HOUR: ${{ vars.REPORT_HOUR || '18' }}
      WHATSAPP_TEMPLATE_NAME: ${{ vars.WHATSAPP_TEMPLATE_NAME || 'hello_world' }}
      WHATSAPP_TEMPLATE_LANG: ${{ vars.WHATSAPP_TEMPLATE_LANG || 'en_US' }}
      WHATSAPP_TEMPLATE_HAS_BODY_PARAM: ${{ vars.WHATSAPP_TEMPLATE_HAS_BODY_PARAM || 'false' }}
      WHATSAPP_ALWAYS_TEMPLATE: ${{ vars.WHATSAPP_ALWAYS_TEMPLATE || 'false' }}
      STATE_BACKEND: json
      STATE_FILE: state/last_signals.json
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-standalone.txt

      - name: Instalar dependencias
        run: pip install -r requirements-standalone.txt

      # El estado anti-spam (última señal por activo) vive en un JSON que se
      # restaura del caché de la ejecución anterior y se vuelve a guardar al final.
      - name: Restaurar estado anti-spam
        uses: actions/cache/restore@v6
        with:
          path: state
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-

      - name: Preparar carpeta de estado
        run: mkdir -p state && touch state/.keep

      - name: Ejecutar escáner
        run: |
          if [ "${{ inputs.mode }}" != "" ] && [ "${{ inputs.mode }}" != "default" ]; then
            python run_standalone.py --mode "${{ inputs.mode }}"
          else
            python run_standalone.py
          fi

      - name: Guardar estado anti-spam
        if: always()
        uses: actions/cache/save@v6
        with:
          path: state
          key: scanner-state-${{ github.run_id }}
